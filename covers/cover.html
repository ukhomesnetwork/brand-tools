<!doctype html>
<!--
  Gatha social cover template. One file, three formats, picked by ?f=
    facebook          820 x 312   (export @2x = 1640 x 624)
    linkedin-company  1128 x 191  (export @1x and @2x)
    linkedin-personal 1584 x 396  (export @1x and @2x)
  Render with: node render.mjs
  Look and feel follows gatha.uk and the Leeds 2026 backdrop:
  navy #000321 ground, purple ambient light, neon pink floorplan line work
  kept to the edges, Poppins, "Property has a new home." with a pink full stop.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Gatha cover</title>
<style>
@font-face{font-family:Poppins;font-weight:400;src:url(assets/fonts/poppins-400.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:500;src:url(assets/fonts/poppins-500.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:600;src:url(assets/fonts/poppins-600.woff2) format("woff2")}
@font-face{font-family:Poppins;font-weight:700;src:url(assets/fonts/poppins-700.woff2) format("woff2")}
:root{
  --navy:#000321;
  --panel:#0d1140;
  --pink:#e62b98;
  --white:#ffffff;
  --muted:#b4b9d6;
  --glass:rgba(8,12,48,.55);
  --glass-line:rgba(255,255,255,.13);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--navy)}
body{font-family:Poppins,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}

.cover{position:relative;overflow:hidden;background:var(--navy)}
/* ambient light, same family as the site's soft purple radials and the backdrop's magenta wash */
.cover::before{content:"";position:absolute;inset:0;z-index:0;background:
  radial-gradient(60% 120% at 50% 115%, rgba(120,24,150,.55), transparent 70%),
  radial-gradient(40% 90% at 8% -10%, rgba(74,26,140,.55), transparent 70%),
  radial-gradient(40% 90% at 96% 0%, rgba(230,43,152,.22), transparent 70%),
  linear-gradient(180deg, #000321 0%, #07052c 60%, #12063a 100%)}
.plan{position:absolute;inset:0;z-index:1;width:100%;height:100%}
.content{position:absolute;z-index:2;display:flex;flex-direction:column}
.lockup{display:block;height:auto}
h1{font-weight:700;letter-spacing:-.02em;line-height:1.05}
h1 .dot{color:var(--pink)}
.sub{font-weight:400;color:var(--muted);line-height:1.35}
.sub strong{color:var(--white);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:.5em;align-self:flex-start;
  background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 30px rgba(0,0,0,.35);
  font-weight:600;color:var(--white);white-space:nowrap}
.pill i{display:block;border-radius:50%;background:var(--pink);box-shadow:0 0 8px var(--pink)}

/* ---------- Facebook 820 x 312: centred, art on both edges ---------- */
.facebook{width:820px;height:312px}
.facebook .content{left:0;right:0;top:56px;align-items:center;text-align:center}
.facebook .lockup{width:150px;margin-bottom:24px}
.facebook h1{font-size:38px}
.facebook .sub{font-size:15px;margin-top:14px}
.facebook .pill{align-self:center;font-size:12px;padding:7px 15px;margin-top:20px}
.facebook .pill i{width:6px;height:6px}

/* ---------- LinkedIn company 1128 x 191: one row, centred ---------- */
.linkedin-company{width:1128px;height:191px}
.linkedin-company .content{left:0;right:0;top:0;bottom:0;flex-direction:row;align-items:center;justify-content:center;gap:34px;padding-left:120px}
.linkedin-company .lockup{width:170px}
.linkedin-company .rule{width:1px;height:76px;background:linear-gradient(transparent,rgba(255,255,255,.28),transparent)}
.linkedin-company .text{display:flex;flex-direction:column}
.linkedin-company h1{font-size:40px}
.linkedin-company .sub{font-size:15px;margin-top:8px}

/* ---------- LinkedIn personal 1584 x 396: profile photo sits bottom-left, so type lives right ---------- */
.linkedin-personal{width:1584px;height:396px}
.linkedin-personal .content{left:560px;right:96px;top:72px;align-items:flex-start}
.linkedin-personal .lockup{width:190px;margin-bottom:26px}
.linkedin-personal h1{font-size:68px}
.linkedin-personal .sub{font-size:21px;margin-top:16px}
.linkedin-personal .pill{font-size:15px;padding:9px 18px;margin-top:24px}
.linkedin-personal .pill i{width:7px;height:7px}

/* safe-zone overlay, only with ?guides=1 */
.guide{position:absolute;z-index:9;border:2px dashed rgba(0,255,200,.8);pointer-events:none}
</style>
</head>
<body>
<div id="cover" class="cover">
  <svg class="plan" id="plan" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice"></svg>
  <div class="content" id="content"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const f = params.get('f') || 'facebook';
const cover = document.getElementById('cover');
cover.classList.add(f);

/* ---------------- copy ---------------- */
const LOCKUP = '<img class="lockup" src="assets/gatha-lockup-white.svg" alt="Gatha">';
const H1 = '<h1>Property has a new home<span class="dot">.</span></h1>';
const SUB = 'The social media platform built for <strong>UK property</strong>.';
const PILL = '<span class="pill"><i></i>gatha.uk</span>';
const content = document.getElementById('content');
if (f === 'linkedin-company') {
  content.innerHTML = `${LOCKUP}<span class="rule"></span><div class="text">${H1}<p class="sub">${SUB}</p></div>`;
} else {
  content.innerHTML = `${LOCKUP}${H1}<p class="sub">${SUB}</p>${PILL}`;
}

/* ---------------- the floorplan ----------------
   One ground floor drawn in a 2400 x 800 plan space, cropped per format.
   Left: stair hall and kitchen. Centre: open living (faded out under the type).
   Right: bedroom, bathroom, study. Walls with window ticks, doors with swing arcs. */
const PLAN = [
  // external walls, window openings marked with jamb ticks
  'M40 60H520 M680 60H1100 M1300 60H2080 M2240 60H2360',
  'M520 46V74 M680 46V74 M1100 46V74 M1300 46V74 M2080 46V74 M2240 46V74',
  'M40 740H900 M1060 740H2360 M900 726V754 M1060 726V754',
  'M40 60V740 M2360 60V740',
  // front door
  'M1060 740H960 A100 100 0 0 1 1060 640',
  // stair hall | kitchen partition + door
  'M420 60V540 M420 640V740 M420 540H520 A100 100 0 0 1 420 640',
  // kitchen | living partition + door
  'M780 60V180 M780 280V740 M780 180H880 A100 100 0 0 1 780 280',
  // living | bedroom wing partition + door
  'M1620 60V500 M1620 600V740 M1520 600A100 100 0 0 1 1620 500 M1620 600H1520',
  // bedroom wing cross wall + study door
  'M1620 400H1900 M2000 400H2360 M2000 400V500 A100 100 0 0 1 1900 400',
  // bedroom | bathroom wall + door
  'M2040 60V260 M2040 340V400 M2040 340H2120 A80 80 0 0 0 2040 260',
  // stair: stringers, treads, cut line, direction arrow
  'M90 120V480 M250 120V480 M90 120H250',
  'M90 150H250 M90 180H250 M90 210H250 M90 240H250 M90 270H250 M90 300H250 M90 330H250 M90 360H250 M90 390H250 M90 420H250 M90 450H250 M90 480H250',
  'M170 460V140 M156 162L170 140L184 162',
  // kitchen run, hob, sink, island
  'M420 130H780',
  'M520 300H680V380H520Z',
  // living: sofa, coffee table
  'M1000 600H1400V680H1000Z M1000 616H1400',
  // bedroom: bed, pillows, duvet fold
  'M1720 64H1940V300H1720Z M1736 80H1820V118H1736Z M1840 80H1924V118H1840Z M1720 150H1940',
  // bathroom: bath, WC cistern
  'M2210 80H2340V340H2210Z M2075 66H2145V92H2075Z',
  // study desk
  'M2100 660H2340V736H2100Z',
  // dimension lines outside the envelope
  'M40 24H420 M40 14V34 M420 14V34 M34 30L46 18 M414 30L426 18',
  'M1620 776H2360 M1620 766V786 M2360 766V786 M1614 782L1626 770 M2354 782L2366 770',
];
const CIRCLES = [
  [560,95,11],[600,95,11],[560,112,0],[2275,310,7],       // hob rings, bath waste
  [1200,520,40],                                           // coffee table
  [2220,620,24],                                           // study chair
];
const ELLIPSES = [[2110,128,26,34]];                        // WC pan
const SINK = 'M650 74H740V118H650Z';

/* per format: which part of the plan shows, and where it fades out for the type */
const VIEWS = {
  'facebook':          {vb:'120 0 2160 820',  fade:[[0,1],[.22,.85],[.33,0],[.67,0],[.78,.85],[1,1]], op:.62},
  'linkedin-company':  {vb:'0 40 2400 406',   fade:[[0,1],[.16,.9],[.27,0],[.79,0],[.88,.9],[1,1]], op:.6},
  'linkedin-personal': {vb:'0 60 2400 600',   fade:[[0,.9],[.24,.9],[.33,0],[.86,0],[.94,.9],[1,1]], op:.6},
};
const view = VIEWS[f];
const svg = document.getElementById('plan');
svg.setAttribute('viewBox', view.vb);
const [, , vbw, vbh] = view.vb.split(' ').map(Number);
const W = cover.offsetWidth, H = cover.offsetHeight;
const k = Math.max(W / vbw, H / vbh);   // px per plan unit (slice)
const u = px => (px / k).toFixed(2);     // px -> plan units, so the neon reads the same at every size

const stops = view.fade.map(([o, a]) => `<stop offset="${o}" stop-color="#fff" stop-opacity="${a}"/>`).join('');
const geom = `
  <path d="${PLAN.join(' ')} ${SINK}"/>
  ${CIRCLES.filter(c => c[2]).map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}
  ${ELLIPSES.map(([x,y,rx,ry]) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"/>`).join('')}`;

/* neon recipe from the site brief: halo, glow, hot core, scaled to the cover */
svg.innerHTML = `
<defs>
  <linearGradient id="fadeG" x1="0" x2="1" y1="0" y2="0">${stops}</linearGradient>
  <mask id="fade" maskUnits="userSpaceOnUse" x="-500" y="-500" width="3400" height="1800">
    <rect x="-500" y="-500" width="3400" height="1800" fill="url(#fadeG)" transform=""/>
  </mask>
  <filter id="halo" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${u(6)}"/></filter>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="${u(2)}"/></filter>
  <g id="geom" fill="none" stroke-linecap="round" stroke-linejoin="round">${geom}</g>
</defs>
<g mask="url(#fade)" opacity="${view.op}">
  <use href="#geom" stroke="#b3148c" stroke-width="${u(7)}" filter="url(#halo)" opacity=".75"/>
  <use href="#geom" stroke="#e62b98" stroke-width="${u(3)}" filter="url(#glow)" opacity=".9"/>
  <use href="#geom" stroke="#ffd6ee" stroke-width="${u(1.15)}"/>
</g>`;

/* the fade gradient has to span the visible viewBox, not the whole plan */
const [vbx] = view.vb.split(' ').map(Number);
const visW = W / k, visX = vbx + (vbw - visW) / 2;
const g = svg.querySelector('#fadeG');
g.setAttribute('gradientUnits', 'userSpaceOnUse');
g.setAttribute('x1', visX); g.setAttribute('x2', visX + visW);

/* optional safe-zone guides for checking crops */
if (params.get('guides')) {
  const zones = {
    'facebook': [{l:133,t:0,w:554,h:312,label:'mobile crop'},{l:16,t:232,w:180,h:80,label:'profile photo'}],
    'linkedin-company': [{l:16,t:95,w:128,h:96,label:'logo'}],
    'linkedin-personal': [{l:40,t:200,w:300,h:196,label:'profile photo'}],
  }[f];
  zones.forEach(z => { const d = document.createElement('div'); d.className = 'guide';
    Object.assign(d.style, {left:z.l+'px', top:z.t+'px', width:z.w+'px', height:z.h+'px'}); cover.appendChild(d); });
}
document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>
